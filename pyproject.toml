[project]
name = "shorts-studio"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "av==12.3.0",
  "faster-whisper>=1.0",
  "opencv-python>=4.9",
  "Pillow>=10.0",
  "PyYAML>=6.0",
  "python-dotenv>=1.0",
  "edge-tts>=6.1",
  "scipy>=1.10",
  "numpy>=1.24",
  "yt-dlp>=2024.1",
]

[tool.setuptools.packages.find]
where = ["src"]
