name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ffmpeg
        run: brew install ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check deps
        run: PYTHONPATH=src python3 -m shorts_studio.cli.main check-deps

      - name: Run tests
        run: PYTHONPATH=src python3 -m pytest tests/ -q --timeout=600
        timeout-minutes: 15